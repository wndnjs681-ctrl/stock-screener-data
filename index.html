<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Screener Pro</title>
<style>
:root{--bg:#0b1020;--panel:#121a2c;--line:#26324a;--text:#edf2ff;--muted:#8ea0bf;--accent:#6ea8fe;--up:#ff5b69;--down:#4b8cff}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}header{height:64px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--line);gap:18px;position:sticky;top:0;background:#0b1020ee;z-index:3}
.brand{font-size:20px;font-weight:800}.tabs button,.ghost,.preset{background:#172139;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer}.tabs button.on{background:#2762d8;border-color:#2762d8}
main{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 64px)}aside{border-right:1px solid var(--line);padding:18px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}.content{padding:18px;min-width:0}
.search{width:100%;background:#0e1628;border:1px solid var(--line);color:white;border-radius:10px;padding:11px}.label{font-size:12px;color:var(--muted);margin:18px 0 8px}.presets{display:flex;flex-wrap:wrap;gap:7px}.filter{margin:10px 0}.filter input{width:100%;background:#0e1628;color:white;border:1px solid var(--line);padding:8px;border-radius:8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.stats{color:var(--muted);font-size:13px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-height:calc(100vh - 135px)}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th{position:sticky;top:0;background:#172139;text-align:right;color:#aebbd3;cursor:pointer}th,td{padding:10px 12px;border-bottom:1px solid #202b40}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}.up{color:var(--up)}.down{color:var(--down)}tr:hover{background:#182238}
.badge{font-size:11px;padding:3px 6px;border-radius:6px;background:#22304d;color:#bdd0f5}.loading{padding:40px;text-align:center;color:var(--muted)}
body.light{--bg:#f6f8fc;--panel:#fff;--line:#d8e0ec;--text:#172033;--muted:#65748b}.pick{cursor:pointer;font-weight:700}@media(max-width:800px){main{grid-template-columns:1fr}aside{position:relative;top:0;height:auto;border-right:0;border-bottom:1px solid var(--line)}}
</style></head><body><header><div class="brand">Stock Screener Pro</div><div class="tabs"><button id="kr" class="on">국내</button><button id="us">미국</button></div><span id="date" class="stats"></span><button class="ghost" id="theme">라이트/다크</button><button class="ghost" id="save">조건 저장</button></header>
<main><aside><input id="q" class="search" placeholder="종목명 / 코드 검색"><div class="label">빠른 전략</div><div class="presets">
<button class="preset" data-p="high">신고가+정배열</button><button class="preset" data-p="pull">정배열 눌림목</button><button class="preset" data-p="vol">거래량 급증</button><button class="preset" data-p="obv">OBV 다이버전스</button><button class="preset" data-p="value">저평가+수익성</button><button class="preset" data-p="clear">초기화</button></div>
<div class="label">수치 필터</div><div class="filter">RSI 최소<input id="rsiMin" type="number" placeholder="예: 40"></div><div class="filter">RSI 최대<input id="rsiMax" type="number" placeholder="예: 70"></div><div class="filter">20일 수익률 최소 %<input id="ret20" type="number" placeholder="예: 0"></div><div class="filter">거래량 배수 최소<input id="vol" type="number" step=".1" placeholder="예: 2"></div><div class="filter">PER 최대<input id="per" type="number" step=".1" placeholder="예: 15"></div><div class="label">저장 조건</div><div id="saved" class="presets"></div></aside>
<section class="content"><div class="top"><div><b id="title">국내 주식</b> <span id="count" class="badge"></span></div><div class="stats">헤더 클릭 = 정렬 · 종목명 클릭 = 상세</div></div><div class="tablewrap"><div id="loading" class="loading">데이터 불러오는 중…</div><table id="tbl" hidden><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div></section></main><dialog id="detail" style="width:min(900px,94vw);background:#0b1020;color:#edf2ff;border:1px solid #26324a;border-radius:14px"><button id="close" class="ghost" style="float:right">닫기</button><h2 id="dtitle"></h2><div id="dmeta" class="stats"></div><canvas id="chart" width="820" height="420" style="width:100%;margin-top:15px;background:#121a2c;border-radius:10px"></canvas></dialog>
<script>
const BASE='./output/';
const cols=[['name','종목'],['symbol','코드'],['close','종가'],['chg1d','1D %'],['ret20','20D %'],['rsi14','RSI'],['vol_ratio20','거래량×'],['ma_bull','정배열'],['hi_gap20','20일고점 %'],['per','PER'],['pbr','PBR'],['roe','ROE'],['market_cap','시총'],['sector','섹터']];
let region='kr', rows=[], sortKey='amount', sortDir=-1, preset='';
const $=x=>document.getElementById(x), num=v=>v==null||!Number.isFinite(+v)?'—':(+v).toLocaleString(undefined,{maximumFractionDigits:2});
async function load(r){region=r;$('loading').hidden=false;$('tbl').hidden=true;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.id===r));
 const j=await fetch(BASE+`universe_${r}.json?${Date.now()}`).then(x=>{if(!x.ok)throw Error(x.status);return x.json()});rows=j.rows||[];$('date').textContent=`기준일 ${j.date||'-'}`;$('title').textContent=r==='kr'?'국내 주식':'미국 주식';render();$('loading').hidden=true;$('tbl').hidden=false}
function filtered(){let a=rows.slice(),q=$('q').value.trim().toLowerCase(),v;
 if(q)a=a.filter(x=>(x.name||'').toLowerCase().includes(q)||(x.symbol||'').toLowerCase().includes(q));
 if((v=+$('rsiMin').value))a=a.filter(x=>+x.rsi14>=v);if($('rsiMax').value!=='')a=a.filter(x=>+x.rsi14<=+$('rsiMax').value);
 if($('ret20').value!=='')a=a.filter(x=>+x.ret20>=+$('ret20').value);if($('vol').value!=='')a=a.filter(x=>+x.vol_ratio20>=+$('vol').value);if($('per').value!=='')a=a.filter(x=>x.per!=null&&+x.per<=+$('per').value);
 if(preset==='high')a=a.filter(x=>x.ma_bull&&x.is_hi20);if(preset==='pull')a=a.filter(x=>x.ma_bull&&x.dist_ma20>=-3&&x.dist_ma20<=3);if(preset==='vol')a=a.filter(x=>+x.vol_ratio20>=2);if(preset==='obv')a=a.filter(x=>x.obv_div);if(preset==='value')a=a.filter(x=>x.per>0&&x.per<=15&&x.roe>=10);
 return a.sort((a,b)=>{let x=a[sortKey],y=b[sortKey];if(typeof x==='string')return sortDir*x.localeCompare(y);return sortDir*((+x||-Infinity)-(+y||-Infinity))})}
function render(){let a=filtered();$('count').textContent=`${a.length.toLocaleString()} 종목`;
 $('head').innerHTML=cols.map(c=>`<th data-k="${c[0]}">${c[1]}</th>`).join('');
 $('body').innerHTML=a.slice(0,1000).map(x=>'<tr>'+cols.map(([k])=>{let v=x[k],cl=(['chg1d','ret20'].includes(k)&&+v!==0)?(+v>0?'up':'down'):'';if(typeof v==='boolean')v=v?'●':'—';else if(['name','symbol','sector'].includes(k))v=v??'—';else v=num(v);return `<td class="${cl} ${k==='name'?'pick':''}" ${k==='name'?`data-sym="${x.symbol}"`:''}>${v}</td>`}).join('')+'</tr>').join('');
 document.querySelectorAll('th').forEach(h=>h.onclick=()=>{sortDir=sortKey===h.dataset.k?-sortDir:-1;sortKey=h.dataset.k;render()});
 document.querySelectorAll('[data-sym]').forEach(e=>e.onclick=()=>openDetail(e.dataset.sym))}
let series={}; async function openDetail(sym){let x=rows.find(r=>r.symbol===sym);$('dtitle').textContent=`${x.name} · ${sym}`;$('dmeta').textContent=`종가 ${num(x.close)} · 20D ${num(x.ret20)}% · RSI ${num(x.rsi14)} · PER ${num(x.per)}`;$('detail').showModal();if(!series[region])series[region]=await fetch(BASE+`series_${region}.json`).then(r=>r.json());draw(sym)}
function draw(sym){let j=series[region],s=(j.series&&j.series[sym])||(j.rows&&j.rows[sym])||j[sym];if(!s||!s.c)return;let a=s.c.slice(-120),cv=$('chart'),c=cv.getContext('2d'),W=cv.width,H=cv.height,p=35,mn=Math.min(...a),mx=Math.max(...a),X=i=>p+i*(W-2*p)/(a.length-1),Y=v=>p+(mx-v)/(mx-mn||1)*(H-2*p);c.clearRect(0,0,W,H);c.strokeStyle='#6ea8fe';c.lineWidth=2;c.beginPath();a.forEach((v,i)=>i?c.lineTo(X(i),Y(v)):c.moveTo(X(i),Y(v)));c.stroke();c.fillStyle='#8ea0bf';c.fillText(mx.toLocaleString(),5,20);c.fillText(mn.toLocaleString(),5,H-12)}
['q','rsiMin','rsiMax','ret20','vol','per'].forEach(id=>$(id).addEventListener('input',render));
document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{preset=b.dataset.p==='clear'?'':b.dataset.p;render()});
$('kr').onclick=()=>load('kr');$('us').onclick=()=>load('us');$('close').onclick=()=>$('detail').close();$('theme').onclick=()=>document.body.classList.toggle('light');
function showSaved(){let a=JSON.parse(localStorage.getItem('screenerSaved')||'[]');$('saved').innerHTML=a.map((x,i)=>`<button class="preset" data-load="${i}">${x.name}</button>`).join('');document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{let x=a[+b.dataset.load];['rsiMin','rsiMax','ret20','vol','per'].forEach(k=>$(k).value=x[k]||'');preset=x.p||'';render()})}
$('save').onclick=()=>{let name=prompt('조건 이름을 입력하세요');if(!name)return;let a=JSON.parse(localStorage.getItem('screenerSaved')||'[]');let x={name,p:preset};['rsiMin','rsiMax','ret20','vol','per'].forEach(k=>x[k]=$(k).value);a.unshift(x);localStorage.setItem('screenerSaved',JSON.stringify(a.slice(0,6)));showSaved()};showSaved();load('kr').catch(e=>$('loading').textContent='로드 실패: '+e.message);
</script></body></html>
